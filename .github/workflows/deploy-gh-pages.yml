name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static site
        env:
          STATIC_EXPORT: "true"
          # Domínio próprio (www.loyalconsulting.com.br) é servido na raiz: sem basePath
          NEXT_PUBLIC_LEADS_ENDPOINT: ${{ vars.PUBLIC_BACKEND_URL }}/api/leads
          NEXT_PUBLIC_TELEMETRY_ENDPOINT: ${{ vars.PUBLIC_BACKEND_URL }}/api/telemetry
          NEXT_PUBLIC_DISCOVERY_SIMPLES_ENDPOINT: ${{ vars.PUBLIC_BACKEND_URL }}/api/discovery-simples
          # Integrações opcionais: defina em Settings → Secrets and variables → Actions → Variables
          NEXT_PUBLIC_HUBSPOT_PORTAL_ID: ${{ vars.HUBSPOT_PORTAL_ID }}
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ${{ vars.CLARITY_PROJECT_ID }}
        run: npm run build:static

      - name: Add nojekyll marker
        run: touch next-dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: next-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
